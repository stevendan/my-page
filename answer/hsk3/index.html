<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đáp án bài tập HSK3</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Đáp án bài tập HSK3</h1>
    <p class="subtitle">Tìm kiếm nhanh và chuyển bài học 1-20 chỉ với một chạm</p>
    <input type="text" id="searchBox" placeholder="Tìm kiếm nội dung...">
    <div class="toolbar">
        <div class="lesson-controls">
            <button id="prevLesson" type="button">◀ Bài trước</button>
            <select id="lessonSelect" aria-label="Chọn bài học"></select>
            <button id="nextLesson" type="button">Bài sau ▶</button>
            <button id="goLesson" type="button">Đi tới bài</button>
        </div>
        <div id="quickLessons" class="quick-lessons" aria-label="Chọn nhanh bài học"></div>
    </div>
    <div class="content-wrap">
    <div id="content"></div>
</div>
<button id="backToTop" class="floating-top" type="button" aria-label="Lên đầu trang">↑</button>

<script src="script.js"></script>
</body>
</html>
